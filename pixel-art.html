<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Portfolio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <div class="nav-container">
    <button id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
    <div class="site-title mobile-only">Advay.dev</div>
    <nav id="navbar">
      <a href="index.html">Home</a>
      <a href="about.html" >About Me</a>
      <a href="developer-projects.html">Developer Projects</a>
      <a href="3d-portfolio.html">3D Portfolio</a>
      <a href="pixel-art.html" class="active">Pixel Art</a>
    </nav>
  </div>
</header> 
  <section id="Page-Title">
    <h1>Pixel Art Portfolio</h1>
  </section>
  
  <main class="gallery-container">

    <aside class="sidebar">
      <h2>Collections</h2>
      <div class="collection" onclick="loadGallery('Amoebash')">Amoebash</div>
      <div class="collection" onclick="loadGallery('App-Icons')">App Icons</div>
      <div class="collection" onclick="loadGallery('Miscellaneous')">Miscellaneous</div>
    </aside>    

    <section class="gallery">
      <h2 id="gallery-title">Amoebash</h2>
      <div id="artwork-grid" class="grid"></div>
    </section>
  </main>

  <!-- Place the script at the bottom of the body -->
  <script type="module">
    // This is the JS for the pixel-art page
    window.loadGallery = async function loadGallery(collection) {
      const galleryTitle = document.getElementById("gallery-title");
      const artworkGrid = document.getElementById("artwork-grid");

      galleryTitle.textContent = collection.replace("-", " ");
      artworkGrid.innerHTML = "";

      try {
        const response = await fetch(`assets/pixel-art/${collection}.json`);
        const images = await response.json();

        images.forEach(fileName => {
          const imgPath = `assets/pixel-art/${collection}/${fileName}`;
          const img = document.createElement("img");
          img.src = imgPath;
          img.alt = fileName;
          img.classList.add("artwork");

          img.onerror = () => img.remove();
          artworkGrid.appendChild(img);
        });
      } catch (error) {
        console.error("Error loading gallery:", error);
      }
    };

    // Initialize the gallery with the default collection on page load
    loadGallery("Amoebash");

    const overlay = document.createElement('div');
    overlay.classList.add('overlay');
    document.body.appendChild(overlay);

    document.getElementById('artwork-grid').addEventListener('click', function(event) {
      if (event.target.tagName === 'IMG') {
        const centeredImg = event.target.cloneNode();
        centeredImg.classList.add('centered-image');

        document.body.appendChild(centeredImg);

        overlay.classList.add('active');

        overlay.addEventListener('click', function() {
          centeredImg.remove();
          overlay.classList.remove('active');
        });
      }
    });
  </script>
    <script type="module" src="js/callOnAll.js"></script>
</body>
</html>
